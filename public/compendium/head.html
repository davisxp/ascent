<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Life Organisation — Xavier's Personal Compendium</title>
<meta name="description" content="A complete personal compendium: dashboard, tasks, finances, investments, wardrobe, curriculum, training, body, grooming, network, career and estate.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2316293f'/%3E%3Crect x='4' y='4' width='56' height='56' rx='7' fill='none' stroke='%23c8a951' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23c8a951' text-anchor='middle'%3EX%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#16293f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ============ TOKENS ============ */
:root{
  --serif: Georgia, 'Palatino Linotype', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --bg:#f2eee3; --bg-deep:#e9e4d4;
  --surface:#fbf9f3; --surface2:#f4f0e4;
  --line:#ddd5c0; --line2:#c9c0a6;
  --ink:#232a38; --ink2:#4c5464; --muted:#8a8270;
  --navy:#1e3a5f; --navy-deep:#16293f; --navy-soft:#2c4a73;
  --gold:#a8842c; --gold2:#c8a951;
  --green:#4a7a52; --green-bg:#e7efe6;
  --red:#a4483c; --red-bg:#f2e3de;
  --rust:#a96a2d; --rust-bg:#f3e8d9;
  --side-bg:#16293f; --side-ink:#d8d2c0; --side-dim:#8fa0b5;
  --shadow: 0 1px 2px rgba(35,42,56,.05), 0 4px 14px rgba(35,42,56,.06);
  --shadow-lg: 0 2px 6px rgba(35,42,56,.08), 0 14px 34px rgba(35,42,56,.10);
}
html[data-theme="dark"]{
  --bg:#11141b; --bg-deep:#0c0f14;
  --surface:#1a1f29; --surface2:#20262f;
  --line:#2b3240; --line2:#3a4354;
  --ink:#e9e4d4; --ink2:#b9b4a3; --muted:#87816f;
  --navy:#9db9dd; --navy-deep:#0d1117; --navy-soft:#7d9cc6;
  --gold:#c8a951; --gold2:#dcc078;
  --green:#83b189; --green-bg:#1d2a20;
  --red:#d08a7c; --red-bg:#2c1d1a;
  --rust:#d19a5f; --rust-bg:#2b2117;
  --side-bg:#0d1117; --side-ink:#d8d2c0; --side-dim:#7c8ba0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.3);
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(200,169,81,.35)}
a{color:var(--navy)}
button{font:inherit; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}

/* ============ APP SHELL ============ */
.app{display:grid; grid-template-columns:270px 1fr; min-height:100vh}
.side{
  background:var(--side-bg); color:var(--side-ink);
  position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column;
  border-right:3px solid var(--gold);
}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:#2a3c55; border-radius:4px}
.brand{padding:26px 22px 20px; display:flex; gap:14px; align-items:center; border-bottom:1px solid rgba(200,169,81,.22)}
.monogram{
  width:52px; height:52px; flex:0 0 52px; border:2px solid var(--gold2); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font:600 30px/1 var(--serif); color:var(--gold2);
  background:linear-gradient(160deg,#1b3252,#12233a);
  box-shadow:inset 0 0 0 2px rgba(200,169,81,.15);
}
.brand h1{font:400 17px/1.25 var(--serif); letter-spacing:.14em; text-transform:uppercase; color:#efe9d8}
.brand small{display:block; margin-top:5px; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--side-dim)}
.nav{padding:14px 12px; flex:1}
.nav-label{padding:8px 12px 10px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--side-dim)}
.nav a{
  display:flex; align-items:baseline; gap:12px; text-decoration:none;
  padding:9px 12px; margin:1px 0; border-radius:6px; color:var(--side-ink);
  font:400 15px var(--serif); letter-spacing:.02em;
  border-left:3px solid transparent; transition:background .15s, color .15s;
}
.nav a .rn{font:400 11px var(--mono); color:var(--gold2); width:26px; flex:0 0 26px; letter-spacing:.08em}
.nav a:hover{background:rgba(200,169,81,.09); color:#fff}
.nav a.on{background:rgba(200,169,81,.14); border-left-color:var(--gold2); color:#fdf6e3}
.side-foot{padding:16px 22px 20px; border-top:1px solid rgba(200,169,81,.22); font-size:12px; color:var(--side-dim)}
.side-foot a{color:var(--side-dim); text-decoration:none; border-bottom:1px dotted rgba(143,160,181,.5)}
.side-foot a:hover{color:var(--gold2)}
.side-foot .contact-line{display:block; margin:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.reset-link{display:inline-block; margin-top:10px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; color:#6f7f95}
.reset-link:hover{color:var(--red)}

/* ============ MAIN / TOPBAR ============ */
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 30px;
}
.crumb{display:flex; align-items:baseline; gap:12px; min-width:0}
.crumb .rn{font:400 12px var(--mono); color:var(--gold); letter-spacing:.14em}
.crumb h2{font:400 21px var(--serif); letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumb .sub{font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.top-right{display:flex; align-items:center; gap:14px; flex-shrink:0}
.clock{text-align:right; line-height:1.25}
.clock .d{font:400 13px var(--serif); letter-spacing:.06em; color:var(--ink2)}
.clock .t{font:400 12px var(--mono); color:var(--muted); letter-spacing:.08em}
.iconbtn{
  width:38px; height:38px; border-radius:4px; border:1px solid var(--line2);
  background:var(--surface); color:var(--ink2); font-size:17px;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.iconbtn:hover{border-color:var(--gold); color:var(--gold)}
.content{padding:30px 34px 70px; max-width:1120px; width:100%; margin:0 auto}

/* ============ SECTION HEADERS ============ */
.sec-head{margin-bottom:28px; padding-bottom:16px; border-bottom:3px double var(--line2)}
.sec-head .eyebrow{font:400 11px var(--mono); letter-spacing:.3em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:10px}
.sec-head .eyebrow::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line2), transparent)}
.sec-head h3{font:400 27px/1.2 var(--serif); margin-top:6px; letter-spacing:.02em}
.sec-head p{color:var(--ink2); margin-top:6px; max-width:70ch; font-size:14px}

/* ============ CARDS ============ */
.card{background:transparent; border:none; box-shadow:none; border-radius:0; padding:0; margin:0 0 38px}
.card-t{
  font:400 15px var(--serif); letter-spacing:.16em; text-transform:uppercase; color:var(--ink);
  padding-bottom:8px; margin-bottom:18px; border-bottom:3px double var(--line2);
  display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.card-t > span:last-child{font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.card-t > span:last-child.t-accent, .card-t .t-accent{color:var(--gold)}
.card-t .t-accent{color:var(--gold)}
.card-t small{font-family:var(--sans); letter-spacing:.02em; text-transform:none; color:var(--muted); font-size:12px}
.grid{display:grid; gap:34px; align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}

/* ============ TILES ============ */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:0; margin:0 0 34px; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2); padding:16px 0}
.tile{background:none; border:none; box-shadow:none; border-radius:0; padding:2px 20px 2px 18px; border-left:1px solid var(--line); position:relative; overflow:hidden}
.tile:first-child{border-left:none; padding-left:2px}
.tile::before{display:none}
.tile.navy::before{background:var(--navy-soft)}
.tile.green::before{background:var(--green)}
.tile.red::before{background:var(--red)}
.tile.rust::before{background:var(--rust)}
.tile.gold::before{background:var(--gold2)}
.tile .k{font:400 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.tile .v{font:400 25px/1.15 var(--serif); margin-top:5px; letter-spacing:.01em; font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px; color:var(--ink2)}
.tile .s{font-size:12px; color:var(--ink2); margin-top:4px}
.tile .s .up{color:var(--green)} .tile .s .dn{color:var(--red)} .tile .s .warn{color:var(--rust)}

/* ============ TABLES ============ */
table.ledger{width:100%; border-collapse:collapse; font-size:14px}
table.ledger th{
  font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  text-align:left; padding:7px 10px; border-bottom:1px solid var(--line2);
}
table.ledger td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
table.ledger tr:last-child td{border-bottom:none}
table.ledger td.num, table.ledger th.num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:13px}
table.ledger tr.total td{border-top:2px solid var(--line2); font-weight:600; background:var(--surface2)}
table.ledger tr.sub td{color:var(--ink2)}
table.ledger .neg{color:var(--red)}
table.ledger .pos{color:var(--green)}
table.ledger .grp td{
  font:400 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--gold);
  padding-top:14px; border-bottom:1px solid var(--line);
}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:14px}
.kv dt{color:var(--muted); font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; font-family:var(--mono); padding-top:2px}
.kv dd{font-variant-numeric:tabular-nums}

/* ============ BARS & CHIPS ============ */
.bar{height:7px; background:var(--bg-deep); border:none; border-radius:2px; overflow:hidden; position:relative}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--navy-soft),var(--navy)); border-radius:2px; transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar.gold i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.green i{background:linear-gradient(90deg,#3d6845,var(--green))}
.bar.red i{background:linear-gradient(90deg,#8c3a30,var(--red))}
.bar.rust i{background:linear-gradient(90deg,#8c5622,var(--rust))}
.bar.slim{height:6px}
.bar-row{display:grid; grid-template-columns:1fr 130px; gap:12px; align-items:center; margin:9px 0}
.bar-row .lbl{font-size:13.5px; display:flex; justify-content:space-between; gap:8px; color:var(--ink2)}
.bar-row .lbl b{color:var(--ink); font-weight:600}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:2.5px 8px; border-radius:3px;
  font:400 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; white-space:nowrap;
  border:1px solid var(--line2); color:var(--ink2); background:var(--surface2);
}
.chip.o{color:var(--green); background:var(--green-bg); border-color:color-mix(in srgb,var(--green) 35%, transparent)}
.chip.r{color:var(--rust); background:var(--rust-bg); border-color:color-mix(in srgb,var(--rust) 40%, transparent)}
.chip.m{color:var(--muted)}
.chip.navy{color:var(--navy); border-color:color-mix(in srgb,var(--navy) 40%, transparent); background:color-mix(in srgb,var(--navy) 8%, transparent)}
.chip.gold{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 45%, transparent); background:color-mix(in srgb,var(--gold) 9%, transparent)}
.chip.red{color:var(--red); background:var(--red-bg); border-color:color-mix(in srgb,var(--red) 35%, transparent)}

/* ============ TABS & FILTERS ============ */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.tab{
  padding:6px 2px; margin-right:20px; border:none; border-bottom:2px solid transparent; background:none;
  font:400 14px var(--serif); letter-spacing:.05em; color:var(--ink2); transition:color .15s, border-color .15s;
}
.tab:hover{color:var(--ink); border-bottom-color:var(--line2)}
.tab.on{border-bottom-color:var(--gold); color:var(--ink); font-style:italic}
html[data-theme="dark"] .tab.on{background:none; border-color:var(--gold); color:var(--gold2)}
.tab .cnt{font:400 10.5px var(--mono); opacity:.75; margin-left:5px}

/* ============ CHECKLISTS ============ */
.ck{display:flex; align-items:flex-start; gap:10px; padding:6px 4px; cursor:pointer; border-radius:6px; user-select:none}
.ck:hover{background:var(--surface2)}
.ck input{position:absolute; opacity:0; pointer-events:none}
.ck .box{
  flex:0 0 18px; width:18px; height:18px; margin-top:1px; border:1.5px solid var(--line2); border-radius:3px;
  background:var(--surface); display:flex; align-items:center; justify-content:center; transition:all .15s;
}
.ck .box::after{content:"✓"; font-size:12px; color:#fff; opacity:0; transform:scale(.4); transition:all .15s}
.ck input:checked + .box{background:var(--green); border-color:var(--green)}
.ck input:checked + .box::after{opacity:1; transform:scale(1)}
.ck .tx{font-size:14px; line-height:1.45}
.ck input:checked ~ .tx{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line2)}
.ck .meta{margin-left:auto; font:400 11.5px var(--mono); color:var(--muted); white-space:nowrap; padding-left:10px}

/* ============ BUTTONS & FIELDS ============ */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:4px;
  border:1px solid var(--navy-deep); background:var(--navy-deep); color:#f0e9d5;
  font:400 13px var(--sans); letter-spacing:.05em; transition:all .15s; text-decoration:none;
}
.btn:hover{filter:brightness(1.15)}
.btn.gold{border-color:var(--gold); background:linear-gradient(160deg,var(--gold2),var(--gold)); color:#20242c; font-weight:600}
.btn.ghost{background:transparent; color:var(--ink2); border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--gold); color:var(--gold); background:transparent}
.btn.sm{padding:5px 11px; font-size:12px}
.field{margin-bottom:12px}
.field label{display:block; font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=date], .field select{
  width:100%; padding:7px 2px; border:none; border-bottom:1px solid var(--line2); border-radius:0;
  background:transparent; color:var(--ink); transition:border-color .15s;
}
.field textarea{
  width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px;
  background:transparent; color:var(--ink); resize:vertical; min-height:110px; line-height:1.7;
}
.field input:focus, .field select:focus{outline:none; border-bottom-color:var(--gold); box-shadow:none}
.field textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,169,81,.12)}
.field select{padding:6px 2px}
input[type=range]{width:100%; accent-color:var(--gold)}

/* ============ DASHBOARD SPECIFICS ============ */
.hero{
  background:linear-gradient(150deg, var(--navy-deep) 0%, #1d3554 58%, #24405f 100%);
  color:#efe9d8; border-radius:3px; padding:28px 30px; margin-bottom:30px;
  border:1px solid rgba(200,169,81,.35); position:relative; overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.hero::after{
  content:""; position:absolute; right:-70px; top:-70px; width:260px; height:260px; border-radius:50%;
  border:1px solid rgba(200,169,81,.25); box-shadow:0 0 0 24px rgba(200,169,81,.06), 0 0 0 60px rgba(200,169,81,.03);
}
.hero .greet{font:400 30px/1.2 var(--serif); letter-spacing:.02em}
.hero .greet em{font-style:normal; color:var(--gold2)}
.hero .date{margin-top:7px; font:400 12.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:#b9c6d6}
.hero .motto{margin-top:16px; padding-top:14px; border-top:1px solid rgba(200,169,81,.3); font:italic 400 15px/1.5 var(--serif); color:#d8d2c0; max-width:60ch}
.today-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-bottom:20px}
.due-item{display:flex; justify-content:space-between; gap:10px; padding:7px 2px; border-bottom:1px dashed var(--line); font-size:13.5px}
.due-item:last-child{border-bottom:none}
.due-item .amt{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap}
.pill-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
.pill{
  padding:6px 10px; border:1px solid var(--line); border-radius:3px; background:transparent;
  font-size:12.5px; color:var(--ink2);
}
.pill b{color:var(--ink); font-variant-numeric:tabular-nums}

/* ============ CURRICULUM ============ */
.course-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:2px 18px}
.course-list .ck .tx{font-size:13.5px}
.course-code{font-family:var(--mono); font-size:11px; color:var(--gold); letter-spacing:.04em; margin-right:6px}
.part-card{border:none; border-radius:0; background:transparent; overflow:visible; box-shadow:none; margin-bottom:30px}
.part-head{padding:0 0 8px; border-bottom:1px solid var(--line2); background:transparent; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.part-head h4{font:400 16px var(--serif); letter-spacing:.02em}
.part-head .prog{font:400 11.5px var(--mono); color:var(--muted)}
.part-body{padding:12px 0 0}

/* ============ WARDROBE ============ */
.ward-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.ward-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border:none; border-bottom:1px dotted var(--line2); border-left:3px solid transparent; border-radius:0;
  padding:8px 6px; background:transparent; cursor:pointer; transition:background .15s; font-size:13.5px;
}
.ward-item:hover{background:var(--surface2)}
.ward-item .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ward-item.s-O{border-left:3px solid var(--green)}
.ward-item.s-R{border-left:3px solid var(--rust)}
.ward-item.s-M{border-left:3px solid var(--line2); color:var(--muted)}
.cat-block{margin-bottom:26px}
.cat-head{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.cat-head h4{font:400 18px var(--serif); letter-spacing:.03em}
.cat-head .rule{flex:1; height:1px; background:var(--line); min-width:20px}

/* ============ WORKOUTS ============ */
.ex-table{width:100%; border-collapse:collapse; font-size:14px}
.ex-table th{font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); text-align:left; padding:7px 10px; border-bottom:1px solid var(--line2)}
.ex-table td{padding:9px 10px; border-bottom:1px solid var(--line)}
.ex-table tr:last-child td{border-bottom:none}
.ex-table td.num{text-align:right; font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
.ex-table .vol td{border-top:2px solid var(--line2); background:var(--surface2); font-weight:600}
.day-dots{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.day-dot{width:38px; text-align:center}
.day-dot .cir{
  width:26px; height:26px; margin:0 auto; border-radius:50%; border:1.5px solid var(--line2);
  display:flex; align-items:center; justify-content:center; font:400 10px var(--mono); color:var(--muted);
  background:var(--surface2);
}
.day-dot.done .cir{background:var(--green); border-color:var(--green); color:#fff}
.day-dot.today .cir{border-color:var(--gold2); color:var(--gold); font-weight:700}
