<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Life Organisation — Xavier's Personal Compendium</title>
<meta name="description" content="A complete personal compendium: dashboard, tasks, finances, investments, wardrobe, curriculum, training, body, grooming, network, career and estate.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2316293f'/%3E%3Crect x='4' y='4' width='56' height='56' rx='7' fill='none' stroke='%23c8a951' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23c8a951' text-anchor='middle'%3EX%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#16293f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ============ TOKENS ============ */
:root{
  --serif: Georgia, 'Palatino Linotype', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --bg:#f2eee3; --bg-deep:#e9e4d4;
  --surface:#fbf9f3; --surface2:#f4f0e4;
  --line:#ddd5c0; --line2:#c9c0a6;
  --ink:#232a38; --ink2:#4c5464; --muted:#8a8270;
  --navy:#1e3a5f; --navy-deep:#16293f; --navy-soft:#2c4a73;
  --gold:#a8842c; --gold2:#c8a951;
  --green:#4a7a52; --green-bg:#e7efe6;
  --red:#a4483c; --red-bg:#f2e3de;
  --rust:#a96a2d; --rust-bg:#f3e8d9;
  --side-bg:#16293f; --side-ink:#d8d2c0; --side-dim:#8fa0b5;
  --shadow: 0 1px 2px rgba(35,42,56,.05), 0 4px 14px rgba(35,42,56,.06);
  --shadow-lg: 0 2px 6px rgba(35,42,56,.08), 0 14px 34px rgba(35,42,56,.10);
}
html[data-theme="dark"]{
  --bg:#11141b; --bg-deep:#0c0f14;
  --surface:#1a1f29; --surface2:#20262f;
  --line:#2b3240; --line2:#3a4354;
  --ink:#e9e4d4; --ink2:#b9b4a3; --muted:#87816f;
  --navy:#9db9dd; --navy-deep:#0d1117; --navy-soft:#7d9cc6;
  --gold:#c8a951; --gold2:#dcc078;
  --green:#83b189; --green-bg:#1d2a20;
  --red:#d08a7c; --red-bg:#2c1d1a;
  --rust:#d19a5f; --rust-bg:#2b2117;
  --side-bg:#0d1117; --side-ink:#d8d2c0; --side-dim:#7c8ba0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.3);
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(200,169,81,.35)}
a{color:var(--navy)}
button{font:inherit; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}

/* ============ APP SHELL ============ */
.app{display:grid; grid-template-columns:270px 1fr; min-height:100vh}
.side{
  background:var(--side-bg); color:var(--side-ink);
  position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column;
  border-right:3px solid var(--gold);
}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:#2a3c55; border-radius:4px}
.brand{padding:26px 22px 20px; display:flex; gap:14px; align-items:center; border-bottom:1px solid rgba(200,169,81,.22)}
.monogram{
  width:52px; height:52px; flex:0 0 52px; border:2px solid var(--gold2); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font:600 30px/1 var(--serif); color:var(--gold2);
  background:linear-gradient(160deg,#1b3252,#12233a);
  box-shadow:inset 0 0 0 2px rgba(200,169,81,.15);
}
.brand h1{font:400 17px/1.25 var(--serif); letter-spacing:.14em; text-transform:uppercase; color:#efe9d8}
.brand small{display:block; margin-top:5px; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--side-dim)}
.nav{padding:14px 12px; flex:1}
.nav-label{padding:8px 12px 10px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--side-dim)}
.nav a{
  display:flex; align-items:baseline; gap:12px; text-decoration:none;
  padding:9px 12px; margin:1px 0; border-radius:6px; color:var(--side-ink);
  font:400 15px var(--serif); letter-spacing:.02em;
  border-left:3px solid transparent; transition:background .15s, color .15s;
}
.nav a .rn{font:400 11px var(--mono); color:var(--gold2); width:26px; flex:0 0 26px; letter-spacing:.08em}
.nav a:hover{background:rgba(200,169,81,.09); color:#fff}
.nav a.on{background:rgba(200,169,81,.14); border-left-color:var(--gold2); color:#fdf6e3}
.side-foot{padding:16px 22px 20px; border-top:1px solid rgba(200,169,81,.22); font-size:12px; color:var(--side-dim)}
.side-foot a{color:var(--side-dim); text-decoration:none; border-bottom:1px dotted rgba(143,160,181,.5)}
.side-foot a:hover{color:var(--gold2)}
.side-foot .contact-line{display:block; margin:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.reset-link{display:inline-block; margin-top:10px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; color:#6f7f95}
.reset-link:hover{color:var(--red)}

/* ============ MAIN / TOPBAR ============ */
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 30px;
}
.crumb{display:flex; align-items:baseline; gap:12px; min-width:0}
.crumb .rn{font:400 12px var(--mono); color:var(--gold); letter-spacing:.14em}
.crumb h2{font:400 21px var(--serif); letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumb .sub{font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.top-right{display:flex; align-items:center; gap:14px; flex-shrink:0}
.clock{text-align:right; line-height:1.25}
.clock .d{font:400 13px var(--serif); letter-spacing:.06em; color:var(--ink2)}
.clock .t{font:400 12px var(--mono); color:var(--muted); letter-spacing:.08em}
.iconbtn{
  width:38px; height:38px; border-radius:4px; border:1px solid var(--line2);
  background:var(--surface); color:var(--ink2); font-size:17px;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.iconbtn:hover{border-color:var(--gold); color:var(--gold)}
.content{padding:30px 34px 70px; max-width:1120px; width:100%; margin:0 auto}

/* ============ SECTION HEADERS ============ */
.sec-head{margin-bottom:28px; padding-bottom:16px; border-bottom:3px double var(--line2)}
.sec-head .eyebrow{font:400 11px var(--mono); letter-spacing:.3em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:10px}
.sec-head .eyebrow::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line2), transparent)}
.sec-head h3{font:400 27px/1.2 var(--serif); margin-top:6px; letter-spacing:.02em}
.sec-head p{color:var(--ink2); margin-top:6px; max-width:70ch; font-size:14px}

/* ============ CARDS ============ */
.card{background:transparent; border:none; box-shadow:none; border-radius:0; padding:0; margin:0 0 38px}
.card-t{
  font:400 15px var(--serif); letter-spacing:.16em; text-transform:uppercase; color:var(--ink);
  padding-bottom:8px; margin-bottom:18px; border-bottom:3px double var(--line2);
  display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.card-t > span:last-child{font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.card-t > span:last-child.t-accent, .card-t .t-accent{color:var(--gold)}
.card-t .t-accent{color:var(--gold)}
.card-t small{font-family:var(--sans); letter-spacing:.02em; text-transform:none; color:var(--muted); font-size:12px}
.grid{display:grid; gap:34px; align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}

/* ============ TILES ============ */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:0; margin:0 0 34px; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2); padding:16px 0}
.tile{background:none; border:none; box-shadow:none; border-radius:0; padding:2px 20px 2px 18px; border-left:1px solid var(--line); position:relative; overflow:hidden}
.tile:first-child{border-left:none; padding-left:2px}
.tile::before{display:none}
.tile.navy::before{background:var(--navy-soft)}
.tile.green::before{background:var(--green)}
.tile.red::before{background:var(--red)}
.tile.rust::before{background:var(--rust)}
.tile.gold::before{background:var(--gold2)}
.tile .k{font:400 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.tile .v{font:400 25px/1.15 var(--serif); margin-top:5px; letter-spacing:.01em; font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px; color:var(--ink2)}
.tile .s{font-size:12px; color:var(--ink2); margin-top:4px}
.tile .s .up{color:var(--green)} .tile .s .dn{color:var(--red)} .tile .s .warn{color:var(--rust)}

/* ============ TABLES ============ */
table.ledger{width:100%; border-collapse:collapse; font-size:14px}
table.ledger th{
  font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  text-align:left; padding:7px 10px; border-bottom:1px solid var(--line2);
}
table.ledger td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
table.ledger tr:last-child td{border-bottom:none}
table.ledger td.num, table.ledger th.num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:13px}
table.ledger tr.total td{border-top:2px solid var(--line2); font-weight:600; background:var(--surface2)}
table.ledger tr.sub td{color:var(--ink2)}
table.ledger .neg{color:var(--red)}
table.ledger .pos{color:var(--green)}
table.ledger .grp td{
  font:400 10.5px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--gold);
  padding-top:14px; border-bottom:1px solid var(--line);
}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:14px}
.kv dt{color:var(--muted); font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; font-family:var(--mono); padding-top:2px}
.kv dd{font-variant-numeric:tabular-nums}

/* ============ BARS & CHIPS ============ */
.bar{height:7px; background:var(--bg-deep); border:none; border-radius:2px; overflow:hidden; position:relative}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--navy-soft),var(--navy)); border-radius:2px; transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar.gold i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.green i{background:linear-gradient(90deg,#3d6845,var(--green))}
.bar.red i{background:linear-gradient(90deg,#8c3a30,var(--red))}
.bar.rust i{background:linear-gradient(90deg,#8c5622,var(--rust))}
.bar.slim{height:6px}
.bar-row{display:grid; grid-template-columns:1fr 130px; gap:12px; align-items:center; margin:9px 0}
.bar-row .lbl{font-size:13.5px; display:flex; justify-content:space-between; gap:8px; color:var(--ink2)}
.bar-row .lbl b{color:var(--ink); font-weight:600}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:2.5px 8px; border-radius:3px;
  font:400 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; white-space:nowrap;
  border:1px solid var(--line2); color:var(--ink2); background:var(--surface2);
}
.chip.o{color:var(--green); background:var(--green-bg); border-color:color-mix(in srgb,var(--green) 35%, transparent)}
.chip.r{color:var(--rust); background:var(--rust-bg); border-color:color-mix(in srgb,var(--rust) 40%, transparent)}
.chip.m{color:var(--muted)}
.chip.navy{color:var(--navy); border-color:color-mix(in srgb,var(--navy) 40%, transparent); background:color-mix(in srgb,var(--navy) 8%, transparent)}
.chip.gold{color:var(--gold); border-color:color-mix(in srgb,var(--gold) 45%, transparent); background:color-mix(in srgb,var(--gold) 9%, transparent)}
.chip.red{color:var(--red); background:var(--red-bg); border-color:color-mix(in srgb,var(--red) 35%, transparent)}

/* ============ TABS & FILTERS ============ */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.tab{
  padding:6px 2px; margin-right:20px; border:none; border-bottom:2px solid transparent; background:none;
  font:400 14px var(--serif); letter-spacing:.05em; color:var(--ink2); transition:color .15s, border-color .15s;
}
.tab:hover{color:var(--ink); border-bottom-color:var(--line2)}
.tab.on{border-bottom-color:var(--gold); color:var(--ink); font-style:italic}
html[data-theme="dark"] .tab.on{background:none; border-color:var(--gold); color:var(--gold2)}
.tab .cnt{font:400 10.5px var(--mono); opacity:.75; margin-left:5px}

/* ============ CHECKLISTS ============ */
.ck{display:flex; align-items:flex-start; gap:10px; padding:6px 4px; cursor:pointer; border-radius:6px; user-select:none}
.ck:hover{background:var(--surface2)}
.ck input{position:absolute; opacity:0; pointer-events:none}
.ck .box{
  flex:0 0 18px; width:18px; height:18px; margin-top:1px; border:1.5px solid var(--line2); border-radius:3px;
  background:var(--surface); display:flex; align-items:center; justify-content:center; transition:all .15s;
}
.ck .box::after{content:"✓"; font-size:12px; color:#fff; opacity:0; transform:scale(.4); transition:all .15s}
.ck input:checked + .box{background:var(--green); border-color:var(--green)}
.ck input:checked + .box::after{opacity:1; transform:scale(1)}
.ck .tx{font-size:14px; line-height:1.45}
.ck input:checked ~ .tx{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line2)}
.ck .meta{margin-left:auto; font:400 11.5px var(--mono); color:var(--muted); white-space:nowrap; padding-left:10px}

/* ============ BUTTONS & FIELDS ============ */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:4px;
  border:1px solid var(--navy-deep); background:var(--navy-deep); color:#f0e9d5;
  font:400 13px var(--sans); letter-spacing:.05em; transition:all .15s; text-decoration:none;
}
.btn:hover{filter:brightness(1.15)}
.btn.gold{border-color:var(--gold); background:linear-gradient(160deg,var(--gold2),var(--gold)); color:#20242c; font-weight:600}
.btn.ghost{background:transparent; color:var(--ink2); border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--gold); color:var(--gold); background:transparent}
.btn.sm{padding:5px 11px; font-size:12px}
.field{margin-bottom:12px}
.field label{display:block; font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.field input[type=text], .field input[type=email], .field input[type=tel], .field input[type=date], .field select{
  width:100%; padding:7px 2px; border:none; border-bottom:1px solid var(--line2); border-radius:0;
  background:transparent; color:var(--ink); transition:border-color .15s;
}
.field textarea{
  width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px;
  background:transparent; color:var(--ink); resize:vertical; min-height:110px; line-height:1.7;
}
.field input:focus, .field select:focus{outline:none; border-bottom-color:var(--gold); box-shadow:none}
.field textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,169,81,.12)}
.field select{padding:6px 2px}
input[type=range]{width:100%; accent-color:var(--gold)}

/* ============ DASHBOARD SPECIFICS ============ */
.hero{
  background:linear-gradient(150deg, var(--navy-deep) 0%, #1d3554 58%, #24405f 100%);
  color:#efe9d8; border-radius:3px; padding:28px 30px; margin-bottom:30px;
  border:1px solid rgba(200,169,81,.35); position:relative; overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.hero::after{
  content:""; position:absolute; right:-70px; top:-70px; width:260px; height:260px; border-radius:50%;
  border:1px solid rgba(200,169,81,.25); box-shadow:0 0 0 24px rgba(200,169,81,.06), 0 0 0 60px rgba(200,169,81,.03);
}
.hero .greet{font:400 30px/1.2 var(--serif); letter-spacing:.02em}
.hero .greet em{font-style:normal; color:var(--gold2)}
.hero .date{margin-top:7px; font:400 12.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:#b9c6d6}
.hero .motto{margin-top:16px; padding-top:14px; border-top:1px solid rgba(200,169,81,.3); font:italic 400 15px/1.5 var(--serif); color:#d8d2c0; max-width:60ch}
.today-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-bottom:20px}
.due-item{display:flex; justify-content:space-between; gap:10px; padding:7px 2px; border-bottom:1px dashed var(--line); font-size:13.5px}
.due-item:last-child{border-bottom:none}
.due-item .amt{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap}
.pill-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
.pill{
  padding:6px 10px; border:1px solid var(--line); border-radius:3px; background:transparent;
  font-size:12.5px; color:var(--ink2);
}
.pill b{color:var(--ink); font-variant-numeric:tabular-nums}

/* ============ CURRICULUM ============ */
.course-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:2px 18px}
.course-list .ck .tx{font-size:13.5px}
.course-code{font-family:var(--mono); font-size:11px; color:var(--gold); letter-spacing:.04em; margin-right:6px}
.part-card{border:none; border-radius:0; background:transparent; overflow:visible; box-shadow:none; margin-bottom:30px}
.part-head{padding:0 0 8px; border-bottom:1px solid var(--line2); background:transparent; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.part-head h4{font:400 16px var(--serif); letter-spacing:.02em}
.part-head .prog{font:400 11.5px var(--mono); color:var(--muted)}
.part-body{padding:12px 0 0}

/* ============ WARDROBE ============ */
.ward-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.ward-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border:none; border-bottom:1px dotted var(--line2); border-left:3px solid transparent; border-radius:0;
  padding:8px 6px; background:transparent; cursor:pointer; transition:background .15s; font-size:13.5px;
}
.ward-item:hover{background:var(--surface2)}
.ward-item .nm{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ward-item.s-O{border-left:3px solid var(--green)}
.ward-item.s-R{border-left:3px solid var(--rust)}
.ward-item.s-M{border-left:3px solid var(--line2); color:var(--muted)}
.cat-block{margin-bottom:26px}
.cat-head{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap}
.cat-head h4{font:400 18px var(--serif); letter-spacing:.03em}
.cat-head .rule{flex:1; height:1px; background:var(--line); min-width:20px}

/* ============ WORKOUTS ============ */
.ex-table{width:100%; border-collapse:collapse; font-size:14px}
.ex-table th{font:400 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); text-align:left; padding:7px 10px; border-bottom:1px solid var(--line2)}
.ex-table td{padding:9px 10px; border-bottom:1px solid var(--line)}
.ex-table tr:last-child td{border-bottom:none}
.ex-table td.num{text-align:right; font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
.ex-table .vol td{border-top:2px solid var(--line2); background:var(--surface2); font-weight:600}
.day-dots{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.day-dot{width:38px; text-align:center}
.day-dot .cir{
  width:26px; height:26px; margin:0 auto; border-radius:50%; border:1.5px solid var(--line2);
  display:flex; align-items:center; justify-content:center; font:400 10px var(--mono); color:var(--muted);
  background:var(--surface2);
}
.day-dot.done .cir{background:var(--green); border-color:var(--green); color:#fff}
.day-dot.today .cir{border-color:var(--gold2); color:var(--gold); font-weight:700}
.day-dot .dl{font:400 9.5px var(--mono); margin-top:4px; color:var(--muted); letter-spacing:.05em}
.rest-day{padding:36px 20px; text-align:center; color:var(--muted)}
.rest-day .big{font:400 26px var(--serif); color:var(--ink2); margin-bottom:6px}

/* ============ DONUT / ALLOCATION ============ */
.donut-wrap{display:flex; gap:26px; align-items:center; flex-wrap:wrap}
.legend{flex:1; min-width:220px}
.legend .li{display:flex; align-items:center; gap:10px; padding:6px 2px; border-bottom:1px dashed var(--line); font-size:13.5px}
.legend .li:last-child{border-bottom:none}
.legend .sw{width:12px; height:12px; border-radius:3px; flex:0 0 12px}
.legend .pc{margin-left:auto; font-family:var(--mono); font-size:12.5px; color:var(--ink2)}
.legend .tk{font:400 10.5px var(--mono); color:var(--muted); border:1px solid var(--line2); border-radius:4px; padding:1px 5px}

/* ============ NETWORK ============ */
.table-scroll{overflow-x:auto}
table.records{width:100%; border-collapse:collapse; font-size:13.5px; min-width:840px}
table.records th{font:400 10.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line2); white-space:nowrap}
table.records td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; white-space:normal; overflow-wrap:anywhere; max-width:340px; height:auto}
table.records tr:hover td{background:var(--surface2)}
.linkbtn{background:none; border:none; color:var(--navy); font-size:12px; text-decoration:underline; padding:2px 4px}
.linkbtn.del{color:var(--red)}
.empty-state{padding:40px 20px; text-align:center; color:var(--muted)}
.empty-state .big{font:italic 400 19px var(--serif); color:var(--ink2); margin-bottom:8px}

/* ============ CAREER ============ */
.career-panel textarea{min-height:150px; font:400 14.5px/1.7 var(--serif)}
.saved-flag{font:400 11px var(--mono); color:var(--green); letter-spacing:.1em; opacity:0; transition:opacity .3s}
.saved-flag.show{opacity:1}

/* ============ ESTATE ============ */
.future-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.future-card{
  border:none; border-top:1px solid var(--line); border-radius:0; padding:12px 4px; text-align:left;
  color:var(--muted); background:transparent; font:italic 400 14.5px var(--serif);
}
.future-card .em{display:block; font:400 21px var(--serif); font-style:normal; color:var(--ink2); margin-bottom:4px; letter-spacing:.04em}

/* ============ MISC ============ */
.note{font-size:12.5px; color:var(--muted); line-height:1.55}
.note b{color:var(--ink2)}
.hint{font:400 11.5px var(--mono); letter-spacing:.06em; color:var(--muted)}
.gold-rule{height:2px; background:linear-gradient(90deg,var(--gold2),transparent); border:none; margin:18px 0}
.two-col{columns:2; column-gap:34px}
@media (max-width:760px){ .two-col{columns:1} }
.stat-inline{display:flex; gap:0; flex-wrap:wrap; align-items:stretch}
.stat-inline .si{padding:2px 22px 2px 18px; border-left:1px solid var(--line)}
.stat-inline .si:first-child{border-left:none; padding-left:0}
.stat-inline .si{font-size:13px; color:var(--muted)}
.stat-inline .si b{display:block; font:400 20px var(--serif); color:var(--ink); font-variant-numeric:tabular-nums}
.flash{animation:flash .6s ease}
@keyframes flash{0%{background:rgba(200,169,81,.25)}100%{background:transparent}}

/* ============ GATE (login key) ============ */
#gate{position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto}
#gate.hidden{display:none}
.gate-card{
  max-width:430px; width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:6px; box-shadow:var(--shadow-lg); padding:34px 32px 26px; text-align:center;
  border-top:3px solid var(--gold2);
}
.gate-card .monogram{margin:0 auto 14px; width:60px; height:60px; flex-basis:60px; font-size:34px}
.gate-title{font:400 25px var(--serif); letter-spacing:.04em}
.gate-sub{color:var(--ink2); font-size:13.5px; margin:8px auto 18px; max-width:34ch; line-height:1.55}
.gate-card .field{text-align:left}
.gate-err{color:var(--red); font-size:13px; min-height:20px; margin-top:8px}
.gate-card .note{margin-top:12px}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ============ HERO CONTEXT CHIPS ============ */
.hero .ctx{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.hero .ctx span{
  border:1px solid rgba(200,169,81,.45); color:#ecdfbe; background:rgba(200,169,81,.14);
  padding:4px 11px; border-radius:99px; font:400 10.5px var(--mono); letter-spacing:.1em; text-transform:uppercase;
}
.hero .ctx span.done{border-color:rgba(131,177,137,.6); background:rgba(131,177,137,.16); color:#cfe6cf}

/* ============ CHARTS ============ */
.chart{width:100%; overflow-x:auto}
.chart svg{display:block; margin:0 auto}
.chart .ax{font:400 9.5px var(--mono); fill:var(--muted); letter-spacing:.06em}
.chart .val{font:400 10px var(--mono); fill:var(--ink2)}

/* ============ COLLAPSED SIDEBAR ============ */
.app{transition:grid-template-columns .2s ease}
.app.collapsed{grid-template-columns:78px 1fr}
.app.collapsed .brand{justify-content:center; padding:20px 6px 16px}
.app.collapsed .brand > div:last-child{display:none}
.app.collapsed .nav-label{display:none}
.app.collapsed .nav a{justify-content:center; padding:10px 4px; border-left-width:0; border-bottom:3px solid transparent; border-radius:8px}
.app.collapsed .nav a.on{border-bottom-color:var(--gold2)}
.app.collapsed .nav a .lbl{display:none}
.app.collapsed .nav a .rn{width:auto}
.app.collapsed .side-foot{display:none}
.nav a .lbl{flex:1}

/* ============ FLUID TYPE & MOTION ============ */
.sec-head h3{font-size:clamp(22px, 2.6vw, 27px)}
.hero .greet{font-size:clamp(23px, 3.2vw, 30px)}
.tile .v{font-size:clamp(21px, 2vw, 25px)}
.crumb h2{font-size:clamp(17px, 1.8vw, 21px)}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important; scroll-behavior:auto !important}
}

/* ============ EDIT MODE ============ */
body.editing [data-p]{
  border-bottom:1.5px dashed var(--gold2); cursor:text; padding:0 2px; border-radius:3px;
  background:color-mix(in srgb, var(--gold2) 10%, transparent);
}
body.editing [data-p]:hover{background:color-mix(in srgb, var(--gold2) 22%, transparent)}
.inline-edit{
  width:90px; padding:2px 6px; border:1px solid var(--gold2); border-radius:6px;
  background:var(--surface); color:var(--ink); font:400 13px var(--mono);
  box-shadow:0 0 0 3px rgba(200,169,81,.18);
}
.inline-edit:focus{outline:none}
#edit-btn.on{background:var(--gold2); border-color:var(--gold2); color:#20242c}
.row-del{
  background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; padding:0 4px;
  visibility:hidden;
}
body.editing .row-del{visibility:visible}
.row-add{
  background:none; border:none; border-bottom:1px dashed var(--line2); border-radius:0; color:var(--muted);
  font:400 11px var(--mono); letter-spacing:.1em; padding:5px 10px; cursor:pointer; margin-top:8px;
  visibility:hidden;
}
body.editing .row-add{visibility:visible}
.row-add:hover{border-color:var(--gold); color:var(--gold)}

/* ============ MOTION POLISH ============ */
@keyframes rise{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
#view > div{animation:rise .28s ease backwards}
.tiles .tile{animation:rise .34s ease backwards}
.tiles .tile:nth-child(2){animation-delay:.04s}
.tiles .tile:nth-child(3){animation-delay:.08s}
.tiles .tile:nth-child(4){animation-delay:.12s}
.tiles .tile:nth-child(5){animation-delay:.16s}
.tiles .tile:nth-child(6){animation-delay:.2s}
.tiles .tile:nth-child(7){animation-delay:.24s}
.tiles .tile:nth-child(8){animation-delay:.28s}
.tiles .tile:nth-child(9){animation-delay:.32s}
.tiles .tile:nth-child(10){animation-delay:.36s}
.today-grid > .card{animation:rise .34s ease backwards}
.today-grid > .card:nth-child(2){animation-delay:.06s}
.today-grid > .card:nth-child(3){animation-delay:.12s}
.today-grid > .card:nth-child(4){animation-delay:.18s}
.today-grid > .card:nth-child(5){animation-delay:.24s}
.today-grid > .card:nth-child(6){animation-delay:.3s}
.today-grid > .card:nth-child(7){animation-delay:.36s}
@keyframes pop{0%{transform:scale(.85)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.ck input:checked + .box{animation:pop .28s ease}
.pal-item .hintmatch{color:var(--gold); font-weight:700}

/* ============ COMMAND PALETTE ============ */
#palette{position:fixed; inset:0; z-index:300; background:rgba(20,24,32,.45); backdrop-filter:blur(3px); display:none; padding-top:12vh; justify-content:center}
#palette.open{display:flex}
.pal-box{width:min(620px,92vw); background:var(--surface); border:1px solid var(--line2); border-radius:12px; box-shadow:var(--shadow-lg); overflow:hidden; align-self:flex-start}
.pal-box input{width:100%; border:none; background:transparent; padding:16px 18px; font:400 17px var(--serif); color:var(--ink); border-bottom:1px solid var(--line)}
.pal-box input:focus{outline:none}
.pal-list{max-height:340px; overflow-y:auto}
.pal-item{padding:10px 18px; display:flex; justify-content:space-between; gap:14px; cursor:pointer; border-bottom:1px solid var(--line); font-size:14px}
.pal-item:last-child{border-bottom:none}
.pal-item.on{background:var(--surface2); box-shadow:inset 3px 0 0 var(--gold2)}
.pal-item b{font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pal-item span{color:var(--muted); font:400 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; flex-shrink:0; align-self:center}
.pal-foot{padding:8px 18px; border-top:1px solid var(--line); display:flex; gap:16px; color:var(--muted); font:400 10.5px var(--mono); letter-spacing:.08em}

details.ckl summary{cursor:pointer; font:400 11.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--gold); padding:8px 0 4px; user-select:none}
details.ckl[open] summary{margin-bottom:4px}
details.ckl .ck{padding:4px}

tr.logrow{cursor:pointer}
tr.logrow:hover td{background:var(--surface2)}
.setpop td{background:var(--surface2); border-bottom:1px solid var(--line2)}
.setpop-in{display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:8px 4px}
.setpop-in label{display:flex; gap:7px; align-items:center; font:400 10.5px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.review-prose{font:italic 400 15.5px/1.75 var(--serif); color:var(--ink2); max-width:82ch}

/* ============ TOAST ============ */
#toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px); z-index:400;
  background:var(--navy-deep); color:#efe9d8; border:1px solid var(--gold2); border-radius:4px;
  padding:12px 20px; font:400 14px var(--serif); box-shadow:var(--shadow-lg);
  opacity:0; pointer-events:none; transition:all .3s ease; max-width:min(560px,92vw); text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%, 0)}

/* ============ WATER & SMALL BTNS ============ */
.mini-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.mini-btn{
  padding:4px 2px; border-radius:0; border:none; border-bottom:1px solid var(--line2); background:transparent;
  font:400 12px var(--mono); letter-spacing:.06em; color:var(--ink2); transition:all .12s;
}
.mini-btn:hover{border-color:var(--gold); color:var(--gold)}

/* ============ COMPACT DENSITY ============ */
body.compact .content{padding:18px 22px 44px}
body.compact .card{margin-bottom:24px}
body.compact .tiles{margin-bottom:20px; padding:10px 0}
body.compact .tile .v{font-size:19px}
body.compact .tile .k{font-size:9.5px}
body.compact table.ledger td, body.compact table.ledger th{padding:5px 8px}
body.compact .ck{padding:3px 4px}
body.compact .due-item{padding:4px 2px}
body.compact .sec-head{margin-bottom:16px; padding-bottom:10px}
body.compact .hero{padding:20px 24px}
body.compact .card-t{margin-bottom:12px}
body.compact .grid{gap:22px}

/* ============ ACCESSIBILITY ============ */
:focus-visible{outline:2px solid var(--gold2); outline-offset:2px; border-radius:4px}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

/* ============ PRINT ============ */
@media print{
  .side, .topbar, #gate, #palette, #toast, .mini-btns, .tabs, .btn, .linkbtn{display:none !important}
  .app{display:block !important}
  body{background:#fff}
  .content{padding:0; max-width:none}
  .card{box-shadow:none; break-inside:avoid; border-color:#bbb}
  .hero{background:#fff; color:#000; border-color:#999}
  .hero .date, .hero .motto{color:#333}
  .tile{box-shadow:none}
}


/* ============ BATCH: capture, heatmap, rings, reading, texture ============ */
#capture{
  flex:1; max-width:340px; padding:7px 12px; border:1px solid var(--line2); border-radius:4px;
  background:var(--surface); color:var(--ink); font:400 13px var(--sans);
}
#capture:focus{outline:none; border-color:var(--gold2); box-shadow:0 0 0 3px rgba(200,169,81,.14)}
@media (max-width:1020px){ #capture{display:none} }
#day-tabs{position:sticky; top:60px; z-index:6; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); padding:8px 0; margin-bottom:14px}
body{background:
  radial-gradient(1100px 500px at 75% -10%, rgba(200,169,81,.06), transparent 60%),
  repeating-linear-gradient(0deg, transparent 0 27px, rgba(30,58,95,.022) 27px 28px),
  var(--bg);}
html[data-theme="dark"] body{background:
  radial-gradient(1100px 500px at 75% -10%, rgba(200,169,81,.05), transparent 60%),
  repeating-linear-gradient(0deg, transparent 0 27px, rgba(200,169,81,.02) 27px 28px),
  var(--bg);}
.heat{display:grid; grid-template-rows:repeat(7, 12px); grid-auto-flow:column; grid-auto-columns:12px; gap:3px; overflow-x:auto; padding:4px 0}
.heat i{border-radius:2px; background:var(--bg-deep); border:1px solid var(--line)}
.heat i.h1{background:color-mix(in srgb, var(--navy-soft) 38%, var(--bg-deep))}
.heat i.h2{background:color-mix(in srgb, var(--navy-soft) 68%, var(--bg-deep))}
.heat i.h3{background:color-mix(in srgb, var(--navy-soft) 100%, var(--bg-deep))}
.heat i.h4{background:var(--gold2); border-color:var(--gold)}
.heat-legend{display:flex; gap:5px; align-items:center; color:var(--muted); font:400 10px var(--mono); letter-spacing:.1em}
.heat-legend i{width:10px; height:10px; border-radius:2px; display:inline-block}
.due-done .due-body{display:none}
.due-done{opacity:.72}
.due-done.expanded .due-body{display:block}
.due-done.expanded{opacity:1}
.due-toggle{cursor:pointer}
body.reading .course-list{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
body.reading .ck .tx{font:400 15.5px/1.85 var(--serif)}
body.reading .career-panel textarea{font:400 16px/1.9 var(--serif); max-width:72ch}
body.reading .review-prose{font-size:17px}
#review-print{display:none}
@media print{
  body.has-review .app{display:none !important}
  body.has-review #review-print{display:block; padding:30px; font:14px/1.6 var(--serif); color:#111}
  #review-print h1{font:400 26px var(--serif); margin:0 0 4px}
  #review-print h2{font:400 15px var(--serif); letter-spacing:.14em; text-transform:uppercase; margin:18px 0 6px; border-bottom:1px solid #999; padding-bottom:4px}
  #review-print table{width:100%; border-collapse:collapse; margin:8px 0}
  #review-print td{padding:4px 8px; border-bottom:1px solid #ccc; font-size:13px}
}
.sw-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:12px}
.sw-time{font:400 26px var(--mono); letter-spacing:.06em; font-variant-numeric:tabular-nums}
.rest-btns .mini-btn{margin-right:6px}

/* ============ RESPONSIVE ============ */
@media (max-width:600px){
  .clock{display:none}
  .topbar{padding:10px 12px}
  .top-right{gap:8px}
}
@media (max-width:1020px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .today-grid{grid-template-columns:1fr 1fr}
  .g-2-1,.g-1-2{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .app.collapsed{grid-template-columns:1fr}
  .app.collapsed .brand{justify-content:flex-start; padding:18px 20px}
  .app.collapsed .brand > div:last-child{display:block}
  .app.collapsed .nav a .lbl{display:inline}
  .app.collapsed .nav a{justify-content:flex-start}
  .app.collapsed .nav-label{display:block}
  .app.collapsed .side-foot{display:none}
  #side-btn{display:none}
  .side{position:static; height:auto; border-right:none; border-bottom:3px solid var(--gold)}
  .brand{padding:18px 20px}
  .nav{display:flex; overflow-x:auto; padding:8px 12px; gap:4px}
  .nav-label{display:none}
  .nav a{flex:0 0 auto; border-left:none; border-bottom:3px solid transparent; border-radius:8px 8px 0 0}
  .nav a.on{border-left:none; border-bottom-color:var(--gold2)}
  .side-foot{display:none}
  .content{padding:20px 16px 50px}
  .topbar{padding:12px 16px}
  .crumb .sub{display:none}
  .crumb{flex:1; min-width:0}
  .today-grid{grid-template-columns:1fr}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .hero .greet{font-size:24px}
}

function randSalt(){

  }catch(e){ return Math.random().toString(16).slice(2) + Date.now().toString(16); }
}
async function digest(s){
  try{

  rec(){ return LS.get('key.v1', null); },

  },
  async verify(pass){
    const r = Gate.rec();

function syncBoot(){
  if (location.protocol !== 'http:' && location.protocol !== 'https:'){
    SYNC.on = false;
    return Promise.resolve();
  }
  try{
  return fetch('/__state', {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(obj => {
    if (!obj || !obj.data) return;
    SYNC.on = true;
    let localMark = 0;
    try{ localMark = +(localStorage.getItem('lifeos.sync.savedAt') || 0); }catch(e){}
    if ((obj.savedAt || 0) > localMark){
      try{
        for (const k in obj.data) localStorage.setItem('lifeos.' + k, JSON.stringify(obj.data[k]));

    const savedAt = Date.now();
    const payload = {app: 'the-life-organisation', savedAt: savedAt, data: allState()};

function invCalc(){

function bodyCalc(){
  const b = P('body');
  const wlog = LS.get('body.log.v1', []);
  const w = wlog.length ? wlog[wlog.length - 1].w : b.weight;
  const bf = (wlog.length && wlog[wlog.length - 1].bf) ? wlog[wlog.length - 1].bf : b.bf;
  const h = b.height, age = b.age;
  const fatMass = w * bf, lbm = w - fatMass;
  const bmi = w / (h * h) * 10000;
  const ffmi = lbm / (h * h) * 10000;
  const normFFMI = ffmi + 6.3 * (1.8 - h / 100);
  const rfm = 64 - 20 * (h / b.waist);
  const navy = 86.01 * Math.log10(Math.max(1, b.waist - b.neck)) - 70.041 * Math.log10(h) + 36.67;
  const inchesOver = Math.round(h / 2.54 - 60);
  const ibw = 50 + 2.3 * Math.max(0, inchesOver);
  const smm = 0.24 * w + 0.15 * h - 0.071 * age - 0.0004 * age * age + 2.7 - 14.2;
  const msj = 10 * w + 6.25 * h - 5 * age + 5;
  const kmca = 370 + 21.6 * lbm;
  const hb = 13.397 * w + 4.799 * h - 5.677 * age + 88.362;
  const bmrMid = [msj, kmca, hb].sort((x, y) => x - y)[1];
  const tdee = bmrMid * b.activity;
  const tef = tdee * 0.1;
  const neat = tdee - bmrMid - tef;
  const goalWeight = lbm / (1 - b.goalBF);
  const ffmiIdeal = (b.ffmiGoal * Math.pow(h / 100, 2)) / (1 - b.goalBF);
  const protein = b.proteinRatio * lbm;
  const fat = b.fatRatio * lbm;
  const maxDeficit = b.maxFatLossRate * fatMass;
  const minCal = tdee - maxDeficit;
  const targetCal = Math.max(tdee - b.deficit, minCal);
  const carbs = Math.max(0, (targetCal - protein * 4 - fat * 9) / 4);
  const water = b.waterRate * w;
  const weeklyG = b.deficit * 7 / 7700 * 1000;
  const weeks = weeklyG > 0 ? (w - goalWeight) / (weeklyG / 1000) : 0;
  const weeklyMaxG = maxDeficit * 7 / 7700 * 1000;
  const weeksMin = weeklyMaxG > 0 ? (w - goalWeight) / (weeklyMaxG / 1000) : 0;
  return {w, bf, h, age, fatMass, lbm, bmi, ffmi, normFFMI, rfm, navy, ibw, smm, msj, kmca, hb, bmrMid, tdee, tef, neat,
    goalWeight, ffmiIdeal, protein, fat, carbs, maxDeficit, minCal, targetCal, water, weeklyG, weeks, weeklyMaxG, weeksMin,
    bmiPrime: bmi / 25};
}

function cardioWeek(){
  const start = LS.get('cardio.start.v1', null);
  let mon;
  if (start){ const p = start.split('-').map(Number); mon = new Date(p[0], p[1] - 1, p[2]); }
  else {
    mon = mondayOfToday();
    LS.set('cardio.start.v1', iso(mon));
  }
  const w = Math.floor((mondayOfToday() - mon) / (7 * 864e5)) + 1;
  return Math.max(1, w);
}
function mondayOfToday(){
  const t = today0();
  const d = new Date(t);
  d.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return d;
}
function cardioRx(type, w){
  w = w || cardioWeek();
  const deload = w % 8 === 0;
  const step = Math.floor((w - 1) / 2);
  const rest = w < 5 ? 90 : (w < 7 ? 75 : 60);
  if (type === 'Intervals'){
    const reps = deload ? 4 : Math.min(6 + step, 10);
    return {line: reps + ' × 60 s hard / ' + rest + ' s easy', reps, rest, work: 60};
  }
  if (type === 'Dashes'){
    const reps = deload ? 5 : Math.min(8 + step, 12);
    return {line: reps + ' × 30 s sprint / ' + rest + ' s rest', reps, rest, work: 30};
  }
  if (type === 'Zone 2 long'){
    const mins = deload ? 20 : Math.min(30 + step * 5, 45);
    return {line: mins + ' min easy — conversational', mins};
  }
  return null;
}
function cardioWeekMins(w){
  const i = cardioRx('Intervals', w), d = cardioRx('Dashes', w), l = cardioRx('Zone 2 long', w);
  return Math.round(10 + i.reps * (60 + i.rest) / 60 + 10 + d.reps * (30 + d.rest) / 60 + l.mins + 20);
}

/* ---------------- sandbox-proof form binding --------------------------
   Sandboxed previews (iframe without allow-forms) never fire `submit`,
   so every form is driven from button clicks and Enter keydowns too.   */
function bindForm(form, handler){
  if (!form) return;
  form.addEventListener('submit', e => { e.preventDefault(); handler(new FormData(form), e); });
  const btn = form.querySelector('[type=submit]');
  if (btn) btn.addEventListener('click', e => { e.preventDefault(); handler(new FormData(form), e); });
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT'){
      e.preventDefault();
      handler(new FormData(form), e);
    }
  });
}

function fulltext(q){
  const out = [];
  if (!q || q.length < 3) return out;
  const ql = q.toLowerCase();
  const hit = (text, kind, label, go) => {
    const t = String(text || '');
    const i = t.toLowerCase().indexOf(ql);
    if (i < 0) return;
    const snip = (i > 28 ? '…' : '') + t.slice(Math.max(0, i - 28), i + 52) + (i + 52 < t.length ? '…' : '');
    out.push({t: label, snip, s: kind, go});
  };
  journal().forEach(j => hit([j.win, j.fault, j.note].join(' · '), 'journal', 'Journal · ' + j.d, () => { location.hash = '#/dashboard'; }));
  places().forEach(p => { hit(p.eat, 'travel', p.place + ' · eat', () => { location.hash = '#/travel'; });

    hit(p.do, 'travel', p.place + ' · do', () => { location.hash = '#/travel'; });
    hit(p.notes, 'travel', p.place + ' · notes', () => { location.hash = '#/travel'; }); });
  const c = LS.get('career.v1', {});
  ['asp', 'desires', 'values', 'strengths', 'weaknesses'].forEach(k => hit(c[k], 'career', 'Career · ' + k, () => { location.hash = '#/career'; }));
  LS.get('roles.v1', []).forEach(r => { hit(r.summary, 'career', r.title + ' · summary', () => { location.hash = '#/career'; }); (r.highlights || []).forEach(h => hit(h, 'career', r.title + ' · highlight', () => { location.hash = '#/career'; })); });

      if ((g.am || []).filter(Boolean).length >= am && (g.pm || []).filter(Boolean).length >= pm) bump(k.slice(6));
    }
  });
  return m;
}
function prHistory(){
  const ev = [], best = {};
  liftLog().slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0).forEach(e => {
    const cur = e1rm(e.w, e.r);
    if (!best[e.ex] || cur > best[e.ex]){ best[e.ex] = cur; ev.push({d: e.d, ex: e.ex, w: e.w, r: e.r, e1: cur}); }
  });
  return ev.reverse();
}
function empiricalTrend(){
  const log = LS.get('body.log.v1', []);

  const first = log[0], last = log[log.length - 1];
  const p1 = first.d.split('-').map(Number), p2 = last.d.split('-').map(Number);
  const days = (new Date(p2[0], p2[1] - 1, p2[2]) - new Date(p1[0], p1[1] - 1, p1[2])) / 864e5;
  if (days < 7) return null;
  return {perWeek: (last.w - first.w) / days * 7, days, from: first.w, to: last.w};
}
function seasonAccent(){
  const m = new Date().getMonth();
  if (m >= 2 && m <= 4) return ['#a8942c', '#b9a542'];
  if (m >= 5 && m <= 7) return ['#b8860b', '#d1a53c'];
  if (m >= 8 && m <= 10) return ['#a8842c', '#c8a951'];

}

/* ---------------- edit-mode engine ------------------------------------ */
let EDIT = false;
function setEditMode(on){
  EDIT = on;
  document.body.classList.toggle('editing', on);
  const b = document.getElementById('edit-btn');
  if (b){
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  if (on) toast('Edit mode — click any gold-underlined value to change it. Everything derived recalculates at once.');
}
function openEditor(span){
  const path = span.dataset.p;
  const cur = P(path);
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'inline-edit';
  inp.value = (cur == null ? '' : cur);
  span.style.display = 'none';
  span.after(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = ok => {
    if (done) return;
    done = true;
    if (ok){
      const raw = String(inp.value).trim();
      const numv = parseFloat(raw.replace(',', '.'));
      const wasString = typeof cur === 'string';
      if (path.endsWith('.name') || wasString){ setP(path, raw); toast('Saved.'); }
      else if (raw !== '' && isFinite(numv)){ setP(path, numv); toast('Saved — every derived figure recalculated.'); }
      else toast('Not a number — value left unchanged.');
    }
    navigate();
  };
  inp.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') finish(true);
    else if (ev.key === 'Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
}
function initEditEngine(){
  document.addEventListener('click', e => {
    if (!EDIT) return;
    const addB = e.target.closest('[data-padd]');
    if (addB){
      const path = addB.dataset.padd;
      const arr = (P(path) || []).slice();
      arr.push(path.indexOf('pots') >= 0 ? {name: 'New pot', p: 0} : {name: 'New item', amt: 0});
      setP(path, arr);
      navigate();
      return;
    }
    const delB = e.target.closest('[data-pdel]');
    if (delB){
      const bar = delB.dataset.pdel.indexOf('|');
      const path = delB.dataset.pdel.slice(0, bar), i = +delB.dataset.pdel.slice(bar + 1);
      const arr = (P(path) || []).slice();
      arr.splice(i, 1);
      setP(path, arr);
      navigate();
      return;
    }
    const span = e.target.closest('[data-p]');
    if (span && document.contains(span) && !span.querySelector('input')){ e.preventDefault(); openEditor(span); }
  });
}

function taxYearEnd(){
  const n = today0();
  let end = new Date(n.getFullYear(), 3, 5);           // 5 April, UK tax year
  if (n > end) end = new Date(n.getFullYear() + 1, 3, 5);
  return end;
}
function daysToTaxEnd(){ return Math.round((taxYearEnd() - today0()) / 864e5); }
function waterToday(){ return LS.get('water.' + iso(new Date()), 0); }
function addWater(ml){ LS.set('water.' + iso(new Date()), Math.max(0, waterToday() + ml)); return waterToday(); }
function groomStreak(){
  function completeAt(day){
    const st = LS.get('groom.' + iso(day), {});
    const a = (st.am || []).filter(Boolean).length, p = (st.pm || []).filter(Boolean).length;
    return a >= groomFlat('am').length && p >= groomFlat('pm').length;
  }
  const d = new Date(); let s = 0;
  if (!completeAt(d)) d.setDate(d.getDate() - 1);
  while (completeAt(d) && s < 366){ s++; d.setDate(d.getDate() - 1); }
  return s;
}
function parseDateish(s){
  if (!s) return null;
  let m = String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return {d: +m[3], mo: +m[2], y: +m[1]};
  m = String(s).match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{4}))?/);
  if (m) return {d: +m[1], mo: +m[2], y: m[3] ? +m[3] : null};
  return null;
}
function nextOccurrence(pd){
  if (!pd || pd.mo < 1 || pd.mo > 12 || pd.d < 1 || pd.d > 31) return null;
  const t = today0();
  for (let y = t.getFullYear(); y <= t.getFullYear() + 1; y++){
    const cand = new Date(y, pd.mo - 1, pd.d);
    if (cand >= t) return {date: cand, days: Math.round((cand - t) / 864e5)};
  }
  return null;
}
function toast(msg, ms){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), ms || 6000);
}

/* ---------------- lift progression log -------------------------------- */
function liftLog(){ return LS.get('lifts.log.v1', []); }
function e1rm(w, r){ return r === 1 ? w : w * (1 + r / 30); }
function liftPR(ex){
  const es = liftLog().filter(e => e.ex === ex);
  if (!es.length) return null;
  let best = null, last = null;
  es.forEach(e => {
    if (!last || e.d >= last.d) last = e;
    if (!best || e1rm(e.w, e.r) > e1rm(best.w, best.r)) best = e;
  });
  return {best, last, e1: e1rm(best.w, best.r)};
}
function liftSetsThisWeek(){
  const mon = mondayOfToday();
  const end = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 7);
  return liftLog().filter(e => {
    const p = e.d.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    return d >= mon && d < end;
  }).length;
}
function allLiftNames(){
  const out = [];
  DATA.workouts.days.forEach(d => d.exercises.forEach(e => { if (out.indexOf(e.n) < 0) out.push(e.n); }));
  return out;
}
function prescriptionFor(ex){
  for (const d of DATA.workouts.days) for (const e of d.exercises) if (e.n === ex) return e;
  return null;
}

/* ---------------- cardio engine metrics (male, clinical ranges) -------- */
function cardiomed(){ return LS.get('cardiomed.v1', {rhr: 0, hrmax: 0, hrr1: 0, sys: 0, dia: 0, vo2: 0}); }
function cardioMetrics(){
  const cm = cardiomed();
  const age = P('body.age');
  const hrmaxPred = 220 - age;
  const hrmax = cm.hrmax > 0 ? cm.hrmax : hrmaxPred;
  const reserve = (cm.rhr > 0 && cm.hrmax > 0) ? cm.hrmax - cm.rhr : null;
  const vo2 = cm.vo2 > 0 ? cm.vo2 : null;
  let cat = null;
  if (vo2){
    const bands = age < 30
      ? [[52.9, 'superior'], [42.5, 'excellent'], [36.5, 'good'], [33.0, 'fair'], [0, 'poor']]
      : age < 40
      ? [[49.4, 'superior'], [40.0, 'excellent'], [34.5, 'good'], [31.5, 'fair'], [0, 'poor']]
      : age < 50
      ? [[46.4, 'superior'], [38.0, 'excellent'], [33.0, 'good'], [30.0, 'fair'], [0, 'poor']]
      : [[43.4, 'superior'], [34.0, 'excellent'], [30.0, 'good'], [27.0, 'fair'], [0, 'poor']];
    cat = (bands.find(b => vo2 >= b[0]) || bands[bands.length - 1])[1];
  }
  const karvonen = (lo, hi) => reserve == null ? null :
    [Math.round(reserve * lo + cm.rhr), Math.round(reserve * hi + cm.rhr)];
  let bp = null;
  if (cm.sys > 0 && cm.dia > 0){
    bp = cm.sys >= 140 || cm.dia >= 90 ? 'high' : cm.sys >= 130 || cm.dia >= 85 ? 'high-normal' : cm.sys >= 120 || cm.dia >= 80 ? 'normal' : 'optimal';
  }
  const recovery = cm.hrr1 > 0 ? (cm.hrr1 >= 30 ? 'excellent' : cm.hrr1 >= 12 ? 'normal' : 'slow — worth mentioning') : null;
  const hrvBand = cm.hrv > 0 ? (cm.hrv < 20 ? 'low — recover harder' : cm.hrv <= 70 ? 'typical (20–70 ms)' : 'well recovered') : null;
  return {cm, hrmaxPred, hrmax, reserve, vo2, cat, karvonen, bp, recovery, hrvBand};
}

function sleepStats(){

/* ---------------- the Sunday review ------------------------------------ */
function isoWeekNo(){
  const d = new Date();
  const t = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - t) / 864e5) + t.getDay() + 1) / 7);
}
function weekReview(){
  const mon = mondayOfToday(), t0 = today0();
  const inWeek = ds => { const p = String(ds).split('-').map(Number); const d = new Date(p[0], p[1] - 1, p[2]); return d >= mon && d <= t0; };
  const lifts = liftLog().filter(e => inWeek(e.d));
  const vol = lifts.reduce((a, e) => a + e.w * e.r, 0);
  const cardioMin = cardioLog().filter(e => inWeek(e.d)).reduce((a, e) => a + (+e.mins || 0), 0);
  const sessions = Object.keys(trainLog()).filter(inWeek).length;
  const sl = sleepLog().filter(e => inWeek(e.d));
  const avgH = sl.length ? sl.reduce((a, e) => a + (+e.h || 0), 0) / sl.length : null;
  const wls = LS.get('body.log.v1', []).filter(e => inWeek(e.d));
  const wDelta = wls.length >= 2 ? wls[wls.length - 1].w - wls[0].w : (wls.length === 1 ? 0 : null);
  const prs = [];
  const names = [];
  liftLog().forEach(e => { if (names.indexOf(e.ex) < 0) names.push(e.ex); });
  names.forEach(n => { const pr = liftPR(n); if (pr && inWeek(pr.best.d)) prs.push(n + ' ' + pr.best.w + '×' + pr.best.r); });
  let groomDays = 0;
  for (let d = new Date(mon); d <= t0; d.setDate(d.getDate() + 1)){
    const st = LS.get('groom.' + iso(d), {});
    if ((st.am || []).filter(Boolean).length >= groomFlat('am').length && (st.pm || []).filter(Boolean).length >= groomFlat('pm').length) groomDays++;
  }
  const hobN = (() => { try { return hobbies().pursuits.filter(p => p.last && inWeek(p.last)).length; } catch (e) { return 0; } })();
  const jw = journal().filter(e => inWeek(e.d));
  const moodAvg = jw.length ? jw.reduce((a, e) => a + (+e.mood || 3), 0) / jw.length : null;
  return {vol, sets: lifts.length, cardioMin, target: cardioWeekMins(cardioWeek()), sessions, avgH,
    readiness: sleepStats(), wDelta, prs, groomDays, hobN, jN: jw.length, moodAvg, days: Math.round((t0 - mon) / 864e5) + 1, weekNo: isoWeekNo()};
}
function reviewProse(R){
  const s = [];
  s.push(R.sessions
    ? R.sessions + ' lifting session' + (R.sessions > 1 ? 's' : '') + ' made the log — ' + (R.sets ? R.sets + ' sets totalling ' + Math.round(R.vol).toLocaleString('en-GB') + ' kg.' : 'though no sets were recorded.')
    : 'No lifting sessions made the log this week; the ledger does not judge, it records.');
  s.push(R.cardioMin >= R.target
    ? 'Cardio met the plan at ' + R.cardioMin + ' of ' + R.target + ' minutes.'
    : R.cardioMin ? 'Cardio reached ' + R.cardioMin + ' of ' + R.target + ' minutes — ' + (R.target - R.cardioMin) + ' shy.' : 'The cardio plan went unrung this week.');
  if (R.avgH) s.push('Sleep averaged ' + num(R.avgH, 1) + ' h' + (R.readiness ? ', for a readiness of ' + R.readiness.score + ' (' + readinessBand(R.readiness) + ')' : '') + '.');
  if (R.wDelta == null) s.push('No weigh-ins this week.');
  else if (R.wDelta < 0) s.push('Weight moved ' + num(Math.abs(R.wDelta), 1) + ' kg in the right direction.');
  else if (R.wDelta > 0) s.push('Weight crept ' + num(R.wDelta, 1) + ' kg — water or feast; the fortnight will tell.');
  else s.push('Weight held steady to the gram.');
  s.push(R.prs.length ? 'Personal records: ' + R.prs.join(', ') + '.' : 'No PRs this week — progression is patience.');
  s.push('Grooming complete on ' + R.groomDays + ' of ' + R.days + ' days.');

}

/* ---------------- tiny chart builders (inline SVG) ------------------- */
function barChart(vals, labels, target, w, h){
  w = w || 560; h = h || 130;
  const max = Math.max(target || 0, ...vals, 1) * 1.15;
  const bw = (w - 40) / vals.length;
  let out = '<svg width="' + w + '" height="' + (h + 26) + '" viewBox="0 0 ' + w + ' ' + (h + 26) + '">';
  if (target){
    const ty = h - (target / max) * h;
    out += '<line x1="30" y1="' + ty + '" x2="' + (w - 6) + '" y2="' + ty + '" stroke="var(--gold2)" stroke-dasharray="4 4" stroke-width="1"/>' +
           '<text x="' + (w - 6) + '" y="' + (ty - 4) + '" text-anchor="end" class="ax">target ' + target + ' min</text>';
  }
  vals.forEach((v, i) => {
    const bh = Math.max(2, (v / max) * h);
    const x = 30 + i * bw + bw * 0.18, y = h - bh;
    out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + (v >= (target || 0) && target ? 'var(--green)' : 'var(--navy-soft)') + '"/>' +
      '<text x="' + (30 + i * bw + bw / 2).toFixed(1) + '" y="' + (h + 14) + '" text-anchor="middle" class="ax">' + labels[i] + '</text>' +
      (v ? '<text x="' + (30 + i * bw + bw / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="middle" class="val">' + v + '</text>' : '');
  });
  out += '<line x1="30" y1="' + h + '" x2="' + (w - 6) + '" y2="' + h + '" stroke="var(--line2)" stroke-width="1"/></svg>';
  return '<div class="chart">' + out + '</div>';
}
function lineChart(pts, w, h, targetVal, unit){
  w = w || 560; h = h || 150;
  if (!pts.length) return '';
  const vals = pts.map(p => p.v).concat(targetVal != null ? [targetVal] : []);
  const min = Math.min(...vals) - 0.6, max = Math.max(...vals) + 0.6;
  const X = i => 34 + (i / Math.max(1, pts.length - 1)) * (w - 48);
  const Y = v => h - ((v - min) / (max - min)) * h;
  let out = '<svg width="' + w + '" height="' + (h + 26) + '" viewBox="0 0 ' + w + ' ' + (h + 26) + '">';
  if (targetVal != null){
    out += '<line x1="34" y1="' + Y(targetVal).toFixed(1) + '" x2="' + (w - 14) + '" y2="' + Y(targetVal).toFixed(1) + '" stroke="var(--gold2)" stroke-dasharray="4 4" stroke-width="1"/>' +
      '<text x="' + (w - 14) + '" y="' + (Y(targetVal) - 5).toFixed(1) + '" text-anchor="end" class="ax">target ' + targetVal + (unit || '') + '</text>';
  }
  out += '<polyline fill="none" stroke="var(--navy-soft)" stroke-width="2" points="' +
    pts.map((p, i) => X(i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ') + '"/>';
  pts.forEach((p, i) => {
    out += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="3" fill="var(--gold2)"><title>' + p.l + ': ' + p.v + (unit || '') + '</title></circle>';
  });
  out += '<text x="34" y="' + (h + 16) + '" class="ax">' + pts[0].l + '</text>' +
    '<text x="' + (w - 14) + '" y="' + (h + 16) + '" text-anchor="end" class="ax">' + pts[pts.length - 1].l + '</text>' +
    '<text x="2" y="12" class="ax">' + max.toFixed(1) + '</text><text x="2" y="' + h + '" class="ax">' + min.toFixed(1) + '</text>' +
    '</svg>';
  return '<div class="chart">' + out + '</div>';
}

}
function money0(n){ return (n < 0 ? '−£' : '£') + Math.abs(n).toLocaleString('en-GB', {maximumFractionDigits: 0}); }

function pctv(n, d){ return ((n || 0) * 100).toFixed(d == null ? 1 : d) + '%'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
